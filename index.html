<!DOCTYPE html>
<html>
<head>
  <title>WebGL Voxel Engine</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; background:#000; }
    canvas { width:100vw; height:100vh; display:block; }
  </style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script>
/*------------------------
    SHADERS
-------------------------*/
const vertexShaderSrc = `
attribute vec3 aPosition;
attribute vec2 aUV;

uniform mat4 uProjection;
uniform mat4 uView;

varying vec2 vUV;

void main() {
  gl_Position = uProjection * uView * vec4(aPosition, 1.0);
  vUV = aUV;
}
`;

const fragmentShaderSrc = `
precision mediump float;
varying vec2 vUV;

void main() {
  gl_FragColor = vec4(vUV.x, vUV.y, 1.0, 1.0); 
}
`;

/*------------------------
    SETUP WEBGL
-------------------------*/
const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl");

canvas.width = innerWidth;
canvas.height = innerHeight;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const vs = compileShader(gl.VERTEX_SHADER, vertexShaderSrc);
const fs = compileShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);

/*---------------------------------------
   SIMPLE CUBE (for voxel block)
----------------------------------------*/
const cubeVertices = new Float32Array([
  // x, y, z,   u, v
  // front
  -0.5,-0.5, 0.5, 0,0,  0.5,-0.5, 0.5, 1,0,  0.5,0.5,0.5, 1,1,
  -0.5,-0.5, 0.5, 0,0,  0.5,0.5,0.5, 1,1, -0.5,0.5,0.5, 0,1,
]);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, cubeVertices, gl.STATIC_DRAW);

/*-------------------------------
   ATTRIBUTES
--------------------------------*/
const aPosition = gl.getAttribLocation(program, "aPosition");
const aUV = gl.getAttribLocation(program, "aUV");

gl.enableVertexAttribArray(aPosition);
gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 20, 0);

gl.enableVertexAttribArray(aUV);
gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 20, 12);

/*-------------------------------
   CAMERA
--------------------------------*/
let yaw = 0, pitch = 0;
let x = 0, y = 1.8, z = 3;

let keys = {};
onkeydown = e => keys[e.key] = true;
onkeyup   = e => keys[e.key] = false;

canvas.onclick = () => canvas.requestPointerLock();
document.onmousemove = e => {
  if (document.pointerLockElement === canvas) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
  }
};

/*-------------------------------
   MATRICES
--------------------------------*/
function mat4() {
  return new Float32Array(16);
}
function identity(m) {
  for (let i=0;i<16;i++) m[i]=0;
  m[0]=m[5]=m[10]=m[15]=1; return m;
}
function perspective(out, fov, aspect, near, far) {
  let f = 1.0 / Math.tan(fov/2);
  out[0]=f/aspect;
  out[5]=f;
  out[10]=(far+near)/(near-far);
  out[11]=-1;
  out[14]=(2*far*near)/(near-far);
  out[1]=out[2]=out[3]=out[4]=out[6]=out[7]=out[8]=out[9]=out[12]=out[13]=out[15]=0;
}

function viewMatrix(out) {
  let cx = Math.cos(yaw), sx = Math.sin(yaw);
  let cy = Math.cos(pitch), sy = Math.sin(pitch);

  let fx = cx*cy;
  let fy = sy;
  let fz = sx*cy;

  let speed = 0.1;
  if (keys["w"]) { x += fx*speed; y += fy*speed; z += fz*speed; }
  if (keys["s"]) { x -= fx*speed; y -= fy*speed; z -= fz*speed; }
  if (keys["a"]) { x += fz*speed; z -= fx*speed; }
  if (keys["d"]) { x -= fz*speed; z += fx*speed; }

  identity(out);
  out[12] = -x;
  out[13] = -y;
  out[14] = -z;
}

/*-------------------------------
   RENDER LOOP
--------------------------------*/
const uProjection = gl.getUniformLocation(program, "uProjection");
const uView = gl.getUniformLocation(program, "uView");

const projection = mat4();
perspective(projection, Math.PI/3, innerWidth/innerHeight, 0.1, 1000);

function loop() {
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  gl.uniformMatrix4fv(uProjection, false, projection);

  const view = mat4();
  viewMatrix(view);
  gl.uniformMatrix4fv(uView, false, view);

  // draw a 10×10 grid of cubes (simple world)
  for (let i=0;i<10;i++) {
    for (let j=0;j<10;j++) {
      let model = identity(mat4());
      model[12] = i - 5;
      model[13] = 0;
      model[14] = j - 5;
      gl.uniformMatrix4fv(uView, false, view);

      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
